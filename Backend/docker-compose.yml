version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-short-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aishortspassword123}
      POSTGRES_DB: ${DB_NAME:-ai_short}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-short-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-short-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8000}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-aishortspassword123}@postgres:5432/${DB_NAME:-ai_short}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SSL_STORE_ID: ${SSL_STORE_ID}
      SSL_STORE_PASSWORD: ${SSL_STORE_PASSWORD}
      SSL_IS_LIVE: ${SSL_IS_LIVE:-false}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      MOCK_AI_MODE: ${MOCK_AI_MODE:-false}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./videos:/app/videos
    networks:
      - ai-short-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: ai-short-postgres-data

networks:
  ai-short-network:
    name: ai-short-network
    driver: bridge