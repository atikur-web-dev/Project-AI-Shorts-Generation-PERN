version: '3.8'

services:
  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    container_name: ai-short-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aishortspassword123
      POSTGRES_DB: ai_short
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-short-network

  # ===== Backend  =====
  backend:
    image: node:22-alpine
    container_name: ai-short-backend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://postgres:aishortspassword123@postgres:5432/ai_short
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MOCK_AI_MODE: ${MOCK_AI_MODE:-true}
    depends_on:
      - postgres
    networks:
      - ai-short-network
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"

volumes:
  postgres_data:

networks:
  ai-short-network: